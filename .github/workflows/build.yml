name: Build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-mac:
    name: macOS (VST3 + AU + Standalone)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure (Release)
        run: cmake --preset mac-release

      - name: Build
        run: cmake --build Builds/mac-release --config Release

      - name: Test
        run: ctest --test-dir Builds/mac-release --output-on-failure

      - name: Verify Universal architecture and macOS minimum version
        run: |
          python3 - <<'PYVERIFY'
          from pathlib import Path
          import re
          import subprocess
          binaries = list(Path('Builds/mac-release/SpectralCrrpt_artefacts/Release').glob('*/*/Contents/MacOS/*'))
          assert len(binaries) == 3, binaries
          for binary in binaries:
              archs = subprocess.check_output(['lipo', '-archs', str(binary)], text=True).split()
              assert set(archs) == {'arm64', 'x86_64'}, (binary, archs)
              for arch in archs:
                  output = subprocess.check_output(['otool', '-arch', arch, '-l', str(binary)], text=True)
                  versions = re.findall(r'cmd LC_BUILD_VERSION\s+cmdsize \d+\s+platform \d+\s+minos ([\d.]+)', output)
                  versions += re.findall(r'cmd LC_VERSION_MIN_MACOSX\s+cmdsize \d+\s+version ([\d.]+)', output)
                  assert versions and all(v in ('11.0', '11.0.0') for v in versions), (binary, arch, versions)
              print(binary.name + ': arm64 + x86_64, minimum macOS 11.0')
          PYVERIFY

      - name: Package official macOS binaries
        if: github.repository == 'Dirty-Octopus/spectral-corruptor'
        run: |
          mkdir -p Builds/release-stage Builds/release-packages
          cp -R Builds/mac-release/SpectralCrrpt_artefacts/Release/VST3/*.vst3 Builds/release-stage/
          cp -R Builds/mac-release/SpectralCrrpt_artefacts/Release/AU/*.component Builds/release-stage/
          cp -R Builds/mac-release/SpectralCrrpt_artefacts/Release/Standalone/*.app Builds/release-stage/
          ditto -c -k --norsrc Builds/release-stage Builds/release-packages/SpectralCorruptor-macOS.zip
          python3 tools/package_macos.py

      - name: Verify macOS installer payload
        if: github.repository == 'Dirty-Octopus/spectral-corruptor'
        run: |
          pkgutil --expand-full Builds/release-packages/SpectralCorruptor-macOS.pkg Builds/pkg-inspect
          test -f 'Builds/pkg-inspect/Payload/Library/Audio/Plug-Ins/VST3/Spectral Corruptor.vst3/Contents/Info.plist'
          test -f 'Builds/pkg-inspect/Payload/Library/Audio/Plug-Ins/Components/Spectral Corruptor.component/Contents/Info.plist'
          test -f 'Builds/pkg-inspect/Payload/Applications/Spectral Corruptor.app/Contents/Info.plist'

      - name: Verify macOS install and upgrade
        if: github.repository == 'Dirty-Octopus/spectral-corruptor'
        run: |
          target='/Library/Audio/Plug-Ins/VST3/Spectral Corruptor.vst3'
          user_target="$HOME/Library/Audio/Plug-Ins/VST3/Spectral Corruptor.vst3"
          source='Builds/mac-release/SpectralCrrpt_artefacts/Release/VST3/Spectral Corruptor.vst3'
          sudo mkdir -p "$target"
          sudo touch "$target/obsolete-version-marker.txt"
          mkdir -p "$user_target/Contents"
          cp "$source/Contents/Info.plist" "$user_target/Contents/Info.plist"
          touch "$user_target/obsolete-version-marker.txt"
          for attempt in 1 2; do
            sudo installer -pkg Builds/release-packages/SpectralCorruptor-macOS.pkg -target /
            cmp "$source/Contents/MacOS/Spectral Corruptor" "$target/Contents/MacOS/Spectral Corruptor"
            cmp "$source/Contents/MacOS/Spectral Corruptor" "$user_target/Contents/MacOS/Spectral Corruptor"
            test ! -e "$target/obsolete-version-marker.txt"
            test ! -e "$user_target/obsolete-version-marker.txt"
          done

      - name: Upload official macOS package
        if: github.repository == 'Dirty-Octopus/spectral-corruptor'
        uses: actions/upload-artifact@v4
        with:
          name: OfficialReleaseMac
          path: Builds/release-packages/SpectralCorruptor-macOS.*
          if-no-files-found: error

      - name: Upload VST3
        uses: actions/upload-artifact@v4
        with:
          name: SpectralCrrpt_VST3_mac
          path: Builds/mac-release/SpectralCrrpt_artefacts/Release/VST3/*

      - name: Upload AU
        uses: actions/upload-artifact@v4
        with:
          name: SpectralCrrpt_AU_mac
          path: Builds/mac-release/SpectralCrrpt_artefacts/Release/AU/*

      - name: Upload Standalone
        uses: actions/upload-artifact@v4
        with:
          name: SpectralCrrpt_Standalone_mac
          path: Builds/mac-release/SpectralCrrpt_artefacts/Release/Standalone/*

  build-windows:
    name: Windows (VST3)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up MSVC dev environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Configure (Release, Ninja)
        run: cmake -B Builds/win-release -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build Builds/win-release

      - name: Test
        run: ctest --test-dir Builds/win-release --output-on-failure

      - name: Upload VST3
        uses: actions/upload-artifact@v4
        with:
          name: SpectralCrrpt_VST3_win
          path: Builds/win-release/SpectralCrrpt_artefacts/Release/VST3/*

      - name: Package official Windows binaries
        if: github.repository == 'Dirty-Octopus/spectral-corruptor'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force Builds/release-packages
          Compress-Archive -Path Builds/win-release/SpectralCrrpt_artefacts/Release/VST3/*.vst3 -DestinationPath Builds/release-packages/SpectralCorruptor-Windows.zip

      - name: Build Windows installer
        if: github.repository == 'Dirty-Octopus/spectral-corruptor'
        shell: pwsh
        run: |
          $compiler = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $compiler)) {
            choco install innosetup --yes --no-progress
            if ($LASTEXITCODE -ne 0) { throw 'Could not install Inno Setup' }
          }
          $version = [regex]::Match((Get-Content CMakeLists.txt -Raw), 'project\(SpectralCrrpt\s+VERSION ([0-9.]+)').Groups[1].Value
          $payload = (Resolve-Path Builds/win-release/SpectralCrrpt_artefacts/Release/VST3).Path
          $output = (Resolve-Path Builds/release-packages).Path
          & $compiler "/DPluginVersion=$version" "/DPayloadRoot=$payload" "/DOutputRoot=$output" tools/windows-installer.iss
          if ($LASTEXITCODE -ne 0) { throw 'Installer compilation failed' }

      - name: Verify Windows install and upgrade
        if: github.repository == 'Dirty-Octopus/spectral-corruptor'
        shell: pwsh
        run: |
          $target = "$env:CommonProgramFiles\VST3\Spectral Corruptor.vst3"
          New-Item -ItemType Directory -Force $target | Out-Null
          Set-Content "$target\obsolete-version-marker.txt" 'old installation'
          $source = Get-ChildItem 'Builds/win-release/SpectralCrrpt_artefacts/Release/VST3/Spectral Corruptor.vst3/Contents/x86_64-win/*.vst3' | Select-Object -First 1
          $installer = (Resolve-Path Builds/release-packages/SpectralCorruptor-Windows-Setup.exe).Path
          foreach ($attempt in 1..2) {
            $process = Start-Process $installer -ArgumentList '/VERYSILENT /SUPPRESSMSGBOXES /NORESTART' -Wait -PassThru
            if ($process.ExitCode -ne 0) { throw "Installer failed: $($process.ExitCode)" }
            if (Test-Path "$target\obsolete-version-marker.txt") { throw 'Old bundle was not replaced' }
            $installed = "$target\Contents\x86_64-win\$($source.Name)"
            if ((Get-FileHash $installed).Hash -ne (Get-FileHash $source.FullName).Hash) { throw 'Installed plugin differs from build' }
          }

      - name: Upload official Windows package
        if: github.repository == 'Dirty-Octopus/spectral-corruptor'
        uses: actions/upload-artifact@v4
        with:
          name: OfficialReleaseWindows
          path: |
            Builds/release-packages/SpectralCorruptor-Windows.zip
            Builds/release-packages/SpectralCorruptor-Windows-Setup.exe
          if-no-files-found: error

  release-packages:
    name: Collect official release packages
    if: github.repository == 'Dirty-Octopus/spectral-corruptor'
    needs: [build-mac, build-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: OfficialRelease*
          merge-multiple: true
          path: release-packages
      - uses: actions/upload-artifact@v4
        with:
          name: OfficialReleasePackages
          path: release-packages/*
          if-no-files-found: error
