name: Build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-mac:
    name: macOS (VST3 + AU + Standalone)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure (Release)
        run: cmake --preset mac-release

      - name: Build
        run: cmake --build Builds/mac-release --config Release

      - name: Test
        run: ctest --test-dir Builds/mac-release --output-on-failure

      - name: Package official macOS binaries
        if: github.repository == 'Dirty-Octopus/spectral-corruptor'
        run: |
          mkdir -p Builds/release-stage Builds/release-packages
          cp -R Builds/mac-release/SpectralCrrpt_artefacts/Release/VST3/*.vst3 Builds/release-stage/
          cp -R Builds/mac-release/SpectralCrrpt_artefacts/Release/AU/*.component Builds/release-stage/
          cp -R Builds/mac-release/SpectralCrrpt_artefacts/Release/Standalone/*.app Builds/release-stage/
          ditto -c -k --norsrc Builds/release-stage Builds/release-packages/SpectralCorruptor-macOS.zip

      - name: Upload official macOS package
        if: github.repository == 'Dirty-Octopus/spectral-corruptor'
        uses: actions/upload-artifact@v4
        with:
          name: OfficialReleaseMac
          path: Builds/release-packages/SpectralCorruptor-macOS.zip
          if-no-files-found: error

      - name: Upload VST3
        uses: actions/upload-artifact@v4
        with:
          name: SpectralCrrpt_VST3_mac
          path: Builds/mac-release/SpectralCrrpt_artefacts/Release/VST3/*

      - name: Upload AU
        uses: actions/upload-artifact@v4
        with:
          name: SpectralCrrpt_AU_mac
          path: Builds/mac-release/SpectralCrrpt_artefacts/Release/AU/*

      - name: Upload Standalone
        uses: actions/upload-artifact@v4
        with:
          name: SpectralCrrpt_Standalone_mac
          path: Builds/mac-release/SpectralCrrpt_artefacts/Release/Standalone/*

  build-windows:
    name: Windows (VST3)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up MSVC dev environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Configure (Release, Ninja)
        run: cmake -B Builds/win-release -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build Builds/win-release

      - name: Test
        run: ctest --test-dir Builds/win-release --output-on-failure

      - name: Upload VST3
        uses: actions/upload-artifact@v4
        with:
          name: SpectralCrrpt_VST3_win
          path: Builds/win-release/SpectralCrrpt_artefacts/Release/VST3/*

      - name: Package official Windows binaries
        if: github.repository == 'Dirty-Octopus/spectral-corruptor'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force Builds/release-packages
          Compress-Archive -Path Builds/win-release/SpectralCrrpt_artefacts/Release/VST3/*.vst3 -DestinationPath Builds/release-packages/SpectralCorruptor-Windows.zip

      - name: Upload official Windows package
        if: github.repository == 'Dirty-Octopus/spectral-corruptor'
        uses: actions/upload-artifact@v4
        with:
          name: OfficialReleaseWindows
          path: Builds/release-packages/SpectralCorruptor-Windows.zip
          if-no-files-found: error

  release-packages:
    name: Collect official release packages
    if: github.repository == 'Dirty-Octopus/spectral-corruptor'
    needs: [build-mac, build-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: OfficialRelease*
          merge-multiple: true
          path: release-packages
      - uses: actions/upload-artifact@v4
        with:
          name: OfficialReleasePackages
          path: release-packages/*.zip
          if-no-files-found: error
